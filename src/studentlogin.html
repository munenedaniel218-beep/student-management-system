<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School System Login</title>
   <script src="https://cdn.tailwindcss.com"></script>
<html lang="en">
  </head>

  <body id="login-page" class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <main id="login-card" class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
      <!-- Top accent bar -->
      <div class="h-1.5 bg-gradient-to-r from-blue-600 via-green-500 to-orange-400"></div>

      <div class="p-8">
        <!-- Logo -->
        <header id="login-header" class="flex flex-col items-center text-center mb-8">
          <div id="school-logo" class="flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-600 text-white shadow-lg shadow-blue-600/30">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3 2 8l10 5 10-5-10-5Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 10.5V15c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M22 8v6" />
            </svg>
          </div>
          <h1 id="school-name" class="mt-4 text-2xl font-bold text-slate-900">Student Login</h1>
          <p id="login-subtitle" class="mt-1 text-sm text-slate-500">Sign in with your admission number</p>
        </header>

        <form id="login-form" class="space-y-5" novalidate>
          <!-- Adm No -->
          <div id="adm-no-group">
            <label for="adm-no" class="mb-1.5 block text-sm font-semibold text-slate-700">Admission number</label>
            <input
              id="adm-no"
              type="text"
              autocomplete="username"
              placeholder="Enter your admission number"
              class="block w-full rounded-lg border border-slate-300 bg-slate-50 px-4 py-2.5 text-slate-900 placeholder-slate-400 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/30"
            />
            <small id="adm-no-error" class="mt-1 block min-h-5 text-sm text-orange-600"></small>
          </div>

          <!-- Password -->
          <div id="password-group">
            <label for="password" class="mb-1.5 block text-sm font-semibold text-slate-700">Password</label>
            <div class="relative">
              <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                class="block w-full rounded-lg border border-slate-300 bg-slate-50 px-4 py-2.5 pr-16 text-slate-900 placeholder-slate-400 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/30"
              />
              <button
                id="toggle-password-button"
                type="button"
                class="absolute inset-y-0 right-0 px-4 text-sm font-medium text-slate-500 hover:text-blue-600"
              >
                Show
              </button>
            </div>
            <small id="password-error" class="mt-1 block min-h-5 text-sm text-orange-600"></small>
          </div>

          <!-- Forgot password -->
          <div id="forgot-password-row" class="flex items-center justify-between text-sm">
            <span class="italic text-slate-500">Forgot password?</span>
            <a id="reset-password-link" href="#" class="font-medium text-blue-600 hover:text-blue-700 hover:underline">Reset it here</a>
          </div>

          <!-- Button -->
          <button
            id="login-button"
            type="submit"
            class="w-full rounded-lg bg-blue-600 py-2.5 font-semibold text-white shadow-md shadow-blue-600/20 transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-blue-600"
          >
            Log in
          </button>
        </form>
      </div>
    </main>

   

    <script type="module" src="/src/js/main.js"></script>
    <script src="/src/js/studentlogin.js"></script>
  </body>
</html>
