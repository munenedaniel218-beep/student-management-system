<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Chat</title>

<script type="module" src="/src/js/main.js"></script>

</head>

<body class="min-h-screen bg-slate-50 text-slate-800">

    <div class="flex min-h-screen">

        <div id="staff-sidebar-container" class="lg:w-64 lg:shrink-0"></div>

        <div class="min-w-0 flex-1">

            <header id="staff-header"></header>

            <main id="staff-announcements-page" class="p-4 md:p-6">

            <div id="chat-container" class="mx-auto flex h-[calc(100vh-7rem)] max-w-5xl flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

                <div id="chat-header" class="flex items-center justify-between border-b border-slate-200 px-4 py-3 md:px-6">

                    <div id="chat-user-info" class="flex min-w-0 items-center gap-3">

                        <div id="chat-user-avatar" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-blue-100 font-semibold text-blue-600">
                            DM
                        </div>

                        <div class="min-w-0">
                            <h1 id="chat-user-name" class="truncate text-sm font-semibold text-slate-900 md:text-base">
                                Dr. Munene
                            </h1>

                            <p id="chat-user-role" class="truncate text-xs text-slate-500 md:text-sm">
                                Lecturer
                            </p>
                        </div>

                    </div>

                    <div id="chat-user-status" class="flex items-center gap-2 text-xs font-medium text-green-600">
                        <span class="h-2 w-2 rounded-full bg-green-500"></span>
                        <span>Online</span>
                    </div>

                </div>

                <div id="chat-messages" class="flex-1 space-y-4 overflow-y-auto bg-slate-50 p-4 md:p-6">

                    <div id="message-001" class="flex justify-start">
                        <div class="max-w-[80%] md:max-w-[65%]">
                            <div class="rounded-2xl rounded-bl-md bg-white px-4 py-3 shadow-sm">
                                <p class="text-sm leading-relaxed text-slate-700">
                                    Hello Daniel, please remember to check your assignment.
                                </p>
                            </div>
                            <p class="mt-1 px-1 text-xs text-slate-400">
                                10:32 AM
                            </p>
                        </div>
                    </div>

                    <div id="message-002" class="flex justify-end">
                        <div class="max-w-[80%] md:max-w-[65%]">
                            <div class="rounded-2xl rounded-br-md bg-blue-600 px-4 py-3 shadow-sm">
                                <p class="text-sm leading-relaxed text-white">
                                    Okay sir, I will check it.
                                </p>
                            </div>
                            <p class="mt-1 px-1 text-right text-xs text-slate-400">
                                10:34 AM
                            </p>
                        </div>
                    </div>

                </div>

                <form id="chat-form" class="border-t border-slate-200 bg-white p-3 md:p-4">

                    <div class="flex items-end gap-2">

                        <div class="min-w-0 flex-1">
                            <label for="chat-message-input" class="sr-only">
                                Message
                            </label>

                            <textarea id="chat-message-input" rows="1" placeholder="Type your message..." class="w-full resize-none rounded-xl border border-slate-300 px-4 py-3 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"></textarea>
                        </div>

                        <button id="chat-send-button" type="submit" class="shrink-0 rounded-xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            Send
                        </button>

                    </div>

                </form>

            </div>

        </main>

        <div id="dashboard-footer"></div>

    </div>

</div>

</body>
</html>
